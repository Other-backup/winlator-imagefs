name: Convert imagefs txz → tar.zst

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: sudo apt-get install -y xz-utils zstd

      - name: Converter txz → tar.zst --ultra -22
        run: |
          cat imagefs.txz.00 imagefs.txz.01 imagefs.txz.02 imagefs.txz.03 \
            | xzcat \
            | zstd --ultra -22 -T0 -o imagefs.tar.zst
          echo "Tamanho: $(du -h imagefs.tar.zst | cut -f1)"

      - name: Dividir em partes de 95MB
        run: |
          split --bytes=95M --numeric-suffixes=0 \
            --suffix-length=2 imagefs.tar.zst "imagefs.tar.zst."
          sha256sum imagefs.tar.zst > imagefs.tar.zst.sha256sum
          ls -lh imagefs.tar.zst.*

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imagefs-zst-latest
          name: "imagefs zstd (ultra -22)"
          body: "Imagefs convertido de .txz para .tar.zst com zstd --ultra -22."
          files: |
            imagefs.tar.zst.*
            imagefs.tar.zst.sha256sum
